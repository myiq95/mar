name: Build IPA for Sideload

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'
      - run: |
          npm ci || npm install
          mkdir -p dist
          cp -r index.html manifest.json sw.js icons dist/ 2>/dev/null || true
      - run: |
          sudo gem install cocoapods
          npx cap add ios || echo "ios exists"
          npx cap copy ios
      - working-directory: ios/App
        run: pod install --repo-update
      - run: |
          cp BackgroundTTSPlugin.swift ios/App/App/ 2>/dev/null || cp ios/BackgroundTTSPlugin.swift ios/App/App/BackgroundTTSPlugin.swift || true
          INFO_PLIST="ios/App/App/Info.plist"
          if ! grep -q "UIBackgroundModes" "$INFO_PLIST"; then
            /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" "$INFO_PLIST" || true
            /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string audio" "$INFO_PLIST" || true
          fi
      - run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos -archivePath build/App.xcarchive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO archive
      - run: |
          cd ios/App
          APP_PATH=$(find build/App.xcarchive -name "*.app" -type d | head -n 1)
          mkdir -p Payload && cp -r "$APP_PATH" Payload/
          zip -r Marvin3Reader-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Marvin3Reader-IPA
          path: ios/App/Marvin3Reader-unsigned.ipa
